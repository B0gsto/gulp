# Auto-merge for GULP (README, "Development").
# When the CI workflow finishes green for a pull request, the PR is merged into main with a merge
# commit ("Merge pull request #N: <title>", like a manual merge) and the CI workflow is dispatched
# on main, because a merge made with the Actions token does not fire ci.yml's push trigger by
# itself; that run is the one whose `engine` job publishes the CI place and runs the engine specs.
# Drafts, PRs with conflicts, PRs not based on main, PRs from forks and PRs whose head moved on
# since the checked commit are left alone.
#
# There is no deploy workflow: the world place is published by hand from Studio
# (docs/09-technical-architecture.md, section 17.2).
name: Auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

# One merge at a time, so two green PRs land one after the other (each dispatching its own CI run).
concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    # Only branches of this repository: a pull request from a fork is never merged by itself.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Merge the pull request and run CI on main
        run: |
          set -euo pipefail
          fields='number,title,isDraft,mergeable,mergeStateStatus,headRefOid,baseRefName'
          pr=""
          # GitHub computes mergeability lazily; give it a few tries.
          for attempt in 1 2 3 4 5 6; do
            pr=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json "$fields" --jq '.[0] // empty')
            if [ -z "$pr" ]; then
              echo "No open pull request for branch $HEAD_BRANCH; nothing to merge."
              exit 0
            fi
            if [ "$(jq -r .mergeable <<<"$pr")" != "UNKNOWN" ]; then
              break
            fi
            sleep 10
          done
          number=$(jq -r .number <<<"$pr")
          title=$(jq -r .title <<<"$pr")
          echo "PR #$number: $title"
          if [ "$(jq -r .baseRefName <<<"$pr")" != "main" ]; then
            echo "Base is not main; leaving it."; exit 0
          fi
          if [ "$(jq -r .isDraft <<<"$pr")" = "true" ]; then
            echo "Draft; leaving it."; exit 0
          fi
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "Head moved on since the checked commit $HEAD_SHA; its own CI run will merge it."; exit 0
          fi
          if [ "$(jq -r .mergeable <<<"$pr")" != "MERGEABLE" ]; then
            echo "::warning title=Not merged::PR #$number is $(jq -r .mergeable <<<"$pr") ($(jq -r .mergeStateStatus <<<"$pr")); resolve it by hand."
            exit 0
          fi
          gh pr merge "$number" --repo "$REPO" --merge --subject "Merge pull request #$number: $title"
          echo "Merged PR #$number into main."
          gh workflow run ci.yml --repo "$REPO" --ref main
          echo "Dispatched the CI workflow for main (its engine job publishes the CI place and runs the engine specs)."
